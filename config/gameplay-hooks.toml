# Native hooks for module EF4AD5E9DD1982ED (the disc executable), at their
# addresses with Title Update 6 applied. Both original instructions are
# checked before launch; tools/audit.py additionally pins the XEX and patch.
# Unlock FPS patch provenance: xenia-canary/game-patches, illusion and boma.

[[midasm_hook]]
address = 0x8254E4A8
name = "Gow3UncapFrameRate"
return_on_true = true

[[midasm_hook]]
address = 0x82B09E5C
name = "Gow3SetPresentInterval"
registers = ["r11"]
after_instruction = true

# Poll idle render tickables (including Bink) with millisecond precision.
# The original 25 ms threshold produces a 25/25/50 ms cadence for 30 FPS movies.
[[midasm_hook]]
address = 0x824042E0
name = "Gow3MoviePollInterval"
registers = ["f0"]
after_instruction = true

# Experimental render size (gow3_render_height): rewrite the engine's stored
# screen size just before CreateDevice reads it.
[[midasm_hook]]
address = 0x82971CDC
name = "Gow3OverrideScreenSize"
after_instruction = false
# FPerspectiveMatrix (0x826310C8) call in ULocalPlayer::CalcSceneView with the
# player camera in r9: field of view (gow3_fov) and render aspects other than
# 16:9 (gow3_aspect_ratio).
[[midasm_hook]]
address = 0x8262CE30
name = "Gow3ConstrainedProjection"
registers = ["f1", "f2", "f3", "r9"]

