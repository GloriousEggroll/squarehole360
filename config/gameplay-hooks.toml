# GFxMovieRoot::SetViewport (r4 = the new GViewport): keep the menus and HUD
# in a centered 16:9 area on screens wider than 16:9.
[[midasm_hook]]
address = 0x82BEA8D8
name = "Gow3ScaleformViewport"
