# Native hooks for module EF4AD5E9DD1982ED. Both original instructions are
# checked before launch; tools/audit.py additionally pins the full XEX hash.
# Unlock FPS patch provenance: xenia-canary/game-patches, illusion and boma.

[[midasm_hook]]
address = 0x8253D9B0
name = "Gow3UncapFrameRate"
return_on_true = true

[[midasm_hook]]
address = 0x82AF66BC
name = "Gow3SetPresentInterval"
registers = ["r11"]
after_instruction = true

# Poll idle render tickables (including Bink) with millisecond precision.
# The original 25 ms threshold produces a 25/25/50 ms cadence for 30 FPS movies.
[[midasm_hook]]
address = 0x823F4148
name = "Gow3MoviePollInterval"
registers = ["f0"]
after_instruction = true

# Experimental render size (gow3_render_height): rewrite the engine's stored
# screen size just before CreateDevice reads it.
[[midasm_hook]]
address = 0x82960D04
name = "Gow3OverrideScreenSize"
after_instruction = false
